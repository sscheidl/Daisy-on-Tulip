name: Publish alpha release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing, unpublished release tag
        required: true
        default: v0.1.0-alpha
      build_run_id:
        description: Successful Build and test run containing the firmware artifacts
        required: true
        default: '38962782176'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download verified firmware build
        uses: actions/download-artifact@v4
        with:
          name: Daisy-on-Tulip-v0.1.0-alpha
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Verify provenance and package release
        run: python3 scripts/package.py
      - name: Publish prerelease and assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --prerelease \
            --title "$RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md \
            artifacts/*.bin artifacts/*.elf artifacts/*.map \
            artifacts/manifest.json artifacts/SHA256SUMS \
            dist/daisy_toy_piano.zip dist/Daisy-on-Tulip-v0.1.0-alpha.zip \
            dist/Daisy-on-Tulip-v0.1.0-alpha.bundle
